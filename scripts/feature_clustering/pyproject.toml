[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coarse-feature-clustering-flip-avg-bundle"
version = "0.1.0"
description = "Standalone bundle for the flip-averaged coarse feature clustering experiment across all supported datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=5.3.0",
    "huggingface-hub>=0.30.0",
    "wandb>=0.19.0",
    "einops>=0.8.0",
    "decord>=0.6.0",
    "pycocotools>=2.0.11",
    "psutil>=7.0.0",
    "scikit-learn>=1.5.0",
    "sam3 @ git+https://github.com/facebookresearch/sam3.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]
text-eval = [
    "huggingface-hub>=0.30.0",
    "torch>=2.7.0",
    "transformers>=5.3.0",
    "torchvision>=0.22.0",
]
oracle-eval = [
    "sam3 @ git+https://github.com/facebookresearch/sam3.git",
    "einops>=0.8.0",
    "decord>=0.6.0",
    "pycocotools>=2.0.11",
    "psutil>=7.0.0",
]
sam2-baseline = [
    "SAM-2 @ git+https://github.com/facebookresearch/sam2.git",
    "huggingface-hub>=0.30.0",
]
wandb = [
    "wandb>=0.19.0",
]

[project.scripts]
coarse-feature-clustering-flip-avg = "rwtd_sam3.cli:main"
rwtd-sam3 = "rwtd_sam3.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
